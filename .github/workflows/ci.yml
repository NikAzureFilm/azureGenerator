name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: typecheck / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm run test:unit

      - name: 3MF export tests
        run: npm run test:3mf

      - name: 3MF visual export check
        run: npm run test:3mf:visual

      - name: Upload 3MF visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3mf-visual-report
          path: tmp/3mf-visual-report.html
          if-no-files-found: ignore

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build expects these to be defined; supply harmless local-style defaults
          # so a fresh fork can still verify the pipeline without prod secrets.
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_POSTHOG_PROJECT_KEY: ci-placeholder-posthog
          VITE_SENTRY_ENVIRONMENT: ci
          VITE_SENTRY_DSN: ''
